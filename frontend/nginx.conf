# Serves the built UI and reverse-proxies the three backend services under one origin
# (the browser needs a single secure origin for microphone access).
#
# Two doors to the same app (routes in assistant.conf):
#   8080  plain http, published on 127.0.0.1 only: the browser on this computer. No sign-in.
#   8443  https for phones, tablets and other computers. Every API call needs a device that
#         signed in with APP_PASSCODE; the chat service checks the session cookie.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    set $remote_access "";
    location = /_auth {
        internal;
        return 204;
    }
    include /etc/nginx/assistant.conf;
}

server {
    listen 8443 ssl;
    http2 on;
    # Made on first start by certs.sh; the CA is offered at /ca.crt so phones can trust it.
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    set $remote_access 1;
    location = /_auth {
        internal;
        proxy_pass http://chat:8001/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Remote-Access 1;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="local-assistant-ca.crt"';
    }
    include /etc/nginx/assistant.conf;
}
