# Serves the built UI and reverse-proxies the three backend services under one origin
# (the browser needs a single secure origin for microphone access).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 30m;

    location / {
        try_files $uri /index.html;
    }

    # Chat REST + Server-Sent Events: disable buffering so tokens stream immediately.
    location /chat/ {
        proxy_pass http://chat:8001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /voice/ {
        proxy_pass http://voice:8002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /wakeword/ {
        proxy_pass http://wakeword:8003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
