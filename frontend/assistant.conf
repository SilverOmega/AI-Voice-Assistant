# Routes shared by both servers in nginx.conf. $remote_access is "1" on the HTTPS port and
# empty on the local one; nginx always overwrites X-Remote-Access, so a client can't set it.
root /usr/share/nginx/html;
client_max_body_size 30m;

location / {
    try_files $uri /index.html;
}

# A new build takes effect on the next reload; the hashed files under /assets never change.
location = /index.html {
    add_header Cache-Control "no-cache";
}
location = /sw.js {
    add_header Cache-Control "no-cache";
}
location = /manifest.webmanifest {
    default_type application/manifest+json;  # not in nginx's mime.types
}

# Signing in has to work before a device is signed in.
location /chat/api/auth/ {
    proxy_pass http://chat:8001/api/auth/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Remote-Access $remote_access;
}

# Chat REST + Server-Sent Events: disable buffering so tokens stream immediately.
location /chat/ {
    auth_request /_auth;
    proxy_pass http://chat:8001/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Who opened the app: shown in sign-in notifications.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Remote-Access $remote_access;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
}

location /voice/ {
    auth_request /_auth;
    proxy_pass http://voice:8002/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /wakeword/ {
    auth_request /_auth;
    proxy_pass http://wakeword:8003/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
