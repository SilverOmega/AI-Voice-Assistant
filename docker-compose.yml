# Local Chat & Voice Assistant
#   docker compose up -d --build        -> http://localhost:8080
# Settings come from .env (copy .env.example). Backend ports are bound to localhost only.
name: voice-assistant

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pulls the configured model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"

  chat:
    build: ./services/chat
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-30}
    volumes:
      - chat-data:/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - ollama
    restart: unless-stopped

  voice:
    build: ./services/voice
    environment:
      CHAT_SERVICE_URL: http://chat:8001
      STT_MODEL: ${STT_MODEL:-base.en}
      STT_LANGUAGE: ${STT_LANGUAGE-en}
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-800}
    volumes:
      - voice-models:/models
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - chat
    restart: unless-stopped

  wakeword:
    build:
      context: ./services/wakeword
      args:
        WAKEWORD_MODELS: ${WAKEWORD_MODELS_BUILD:-hey_jarvis alexa hey_mycroft}
    environment:
      WAKEWORD_DEFAULT: ${WAKEWORD_DEFAULT:-hey_jarvis}
      WAKEWORD_THRESHOLD: ${WAKEWORD_THRESHOLD:-0.5}
    volumes:
      # Drop custom-trained *.onnx wake-word models here.
      - ./models/wakeword:/app/models/wakeword:ro
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      - chat
      - voice
      - wakeword
    restart: unless-stopped

volumes:
  ollama:
  chat-data:
  voice-models:
