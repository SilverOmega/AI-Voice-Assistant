# Local Chat & Voice Assistant
#   docker compose up -d --build        -> http://localhost:8080 on this computer
#                                          https://<this computer's IP>:8443 on phones and tablets
# Settings come from .env (copy .env.example). Backend ports are bound to localhost only; the
# HTTPS port is open to your network, and needs APP_PASSCODE before any other device gets in.
name: voice-assistant

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pulls the configured model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"

  chat:
    build: ./services/chat
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      # Claude with your subscription: the bridge runs on this computer (scripts/bridge.ps1).
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_DOCKER_URL-http://host.docker.internal:8005}
      CLAUDE_BRIDGE_TOKEN: ${CLAUDE_BRIDGE_TOKEN:-}
      CLAUDE_CLI_MODEL: ${CLAUDE_CLI_MODEL:-claude-sonnet-5-5}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-30}
      DOCUMENT_MAX_CHARS: ${DOCUMENT_MAX_CHARS:-40000}
      OLLAMA_MAX_CTX: ${OLLAMA_MAX_CTX:-16384}
      EMAIL_COMPOSE: ${EMAIL_COMPOSE:-gmail}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_DRAFTS_FOLDER: ${IMAP_DRAFTS_FOLDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WORKFLOWS: ${WORKFLOWS:-{}}
      NOTIFY_PHONE: ${NOTIFY_PHONE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NOTIFY_REMIND_MINUTES: ${NOTIFY_REMIND_MINUTES:-30}
      APP_URL: ${APP_URL:-}
      APP_PASSCODE: ${APP_PASSCODE:-}
      WEB_SEARCH: ${WEB_SEARCH:-searxng}
      SEARXNG_URL: http://searxng:8080
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      WEB_SEARCH_RESULTS: ${WEB_SEARCH_RESULTS:-5}
      RATES_CURRENCIES: ${RATES_CURRENCIES:-USD,EUR,JPY,GBP,AUD,SGD,KRW,CNY,THB}
      RATES_CACHE_MINUTES: ${RATES_CACHE_MINUTES:-10}
      RATES_FX_URL: ${RATES_FX_URL-https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx}
      RATES_GOLD_URL: ${RATES_GOLD_URL-https://edge-api.pnj.io/ecom-frontend/v1/get-gold-price?zone=00}
      RATES_WORLD_GOLD_URL: ${RATES_WORLD_GOLD_URL-https://api.gold-api.com/price/XAU}
      AGENT_MODE: ${AGENT_MODE:-toggle}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-180}
      GITHUB_LOOKUP: ${GITHUB_LOOKUP:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # The project folder from .env is mounted at /workspace; empty = no project folder.
      PROJECT_DIR: ${PROJECT_DIR:+/workspace}
      SANDBOX_URL: ${SANDBOX_URL-http://sandbox:8004}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    volumes:
      - chat-data:/data
      # The code helper reads this folder, and changes files in it only after you approve.
      - ${PROJECT_DIR:-./workspace}:/workspace
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      # Docker Desktop has this already; on Linux it points at the computer itself.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - sandbox
    depends_on:
      - ollama
      - searxng
      - sandbox
    restart: unless-stopped

  # Runs Python the code helper wrote, after you approve each run. It sits on a network with
  # no way out (no internet, no other services but chat), has no port on this computer, a
  # read-only filesystem, no Linux capabilities, and memory, CPU and process limits.
  sandbox:
    build: ./services/sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-10}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-256}
      SANDBOX_MAX_OUTPUT: ${SANDBOX_MAX_OUTPUT:-65536}
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # Web search for the chat service: links and related topics under replies. Only the chat
  # service reaches it; no port is published. Set WEB_SEARCH=off in .env to stop using it.
  searxng:
    image: searxng/searxng:${SEARXNG_IMAGE_TAG:-latest}
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-assistant-local-search}
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  voice:
    build: ./services/voice
    environment:
      CHAT_SERVICE_URL: http://chat:8001
      STT_MODEL: ${STT_MODEL:-base.en}
      STT_LANGUAGE: ${STT_LANGUAGE-en}
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      PIPER_VOICES: ${PIPER_VOICES:-}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-800}
    volumes:
      - voice-models:/models
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - chat
    restart: unless-stopped

  wakeword:
    build:
      context: ./services/wakeword
      args:
        WAKEWORD_MODELS: ${WAKEWORD_MODELS_BUILD:-hey_jarvis alexa hey_mycroft}
    environment:
      WAKEWORD_DEFAULT: ${WAKEWORD_DEFAULT:-hey_jarvis}
      WAKEWORD_THRESHOLD: ${WAKEWORD_THRESHOLD:-0.5}
    volumes:
      # Drop custom-trained *.onnx wake-word models here.
      - ./models/wakeword:/app/models/wakeword:ro
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # This computer's LAN address (or name.local), for the HTTPS certificate. scripts/lan.ps1 sets it.
      TLS_HOSTS: ${TLS_HOSTS:-}
    volumes:
      - certs:/etc/nginx/certs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      # Phones, tablets and other computers. Set REMOTE_BIND=127.0.0.1 to turn this off.
      - "${REMOTE_BIND:-0.0.0.0}:${APP_HTTPS_PORT:-8443}:8443"
    depends_on:
      - chat
      - voice
      - wakeword
    restart: unless-stopped

networks:
  default:
  # Internal: the code sandbox can talk to the chat service and nothing else.
  sandbox:
    internal: true

volumes:
  ollama:
  chat-data:
  voice-models:
  certs:
