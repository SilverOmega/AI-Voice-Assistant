# Local Chat & Voice Assistant
#   docker compose up -d --build        -> http://localhost:8080 on this computer
#                                          https://<this computer's IP>:8443 on phones and tablets
# Settings come from .env (copy .env.example). Backend ports are bound to localhost only; the
# HTTPS port is open to your network, and needs APP_PASSCODE before any other device gets in.
name: voice-assistant

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pulls the configured model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"

  chat:
    build: ./services/chat
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-30}
      DOCUMENT_MAX_CHARS: ${DOCUMENT_MAX_CHARS:-40000}
      OLLAMA_MAX_CTX: ${OLLAMA_MAX_CTX:-16384}
      EMAIL_COMPOSE: ${EMAIL_COMPOSE:-gmail}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_DRAFTS_FOLDER: ${IMAP_DRAFTS_FOLDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WORKFLOWS: ${WORKFLOWS:-{}}
      NOTIFY_PHONE: ${NOTIFY_PHONE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NOTIFY_REMIND_MINUTES: ${NOTIFY_REMIND_MINUTES:-30}
      APP_URL: ${APP_URL:-}
      APP_PASSCODE: ${APP_PASSCODE:-}
    volumes:
      - chat-data:/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - ollama
    restart: unless-stopped

  voice:
    build: ./services/voice
    environment:
      CHAT_SERVICE_URL: http://chat:8001
      STT_MODEL: ${STT_MODEL:-base.en}
      STT_LANGUAGE: ${STT_LANGUAGE-en}
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-800}
    volumes:
      - voice-models:/models
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - chat
    restart: unless-stopped

  wakeword:
    build:
      context: ./services/wakeword
      args:
        WAKEWORD_MODELS: ${WAKEWORD_MODELS_BUILD:-hey_jarvis alexa hey_mycroft}
    environment:
      WAKEWORD_DEFAULT: ${WAKEWORD_DEFAULT:-hey_jarvis}
      WAKEWORD_THRESHOLD: ${WAKEWORD_THRESHOLD:-0.5}
    volumes:
      # Drop custom-trained *.onnx wake-word models here.
      - ./models/wakeword:/app/models/wakeword:ro
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # This computer's LAN address (or name.local), for the HTTPS certificate. scripts/lan.ps1 sets it.
      TLS_HOSTS: ${TLS_HOSTS:-}
    volumes:
      - certs:/etc/nginx/certs
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      # Phones, tablets and other computers. Set REMOTE_BIND=127.0.0.1 to turn this off.
      - "${REMOTE_BIND:-0.0.0.0}:${APP_HTTPS_PORT:-8443}:8443"
    depends_on:
      - chat
      - voice
      - wakeword
    restart: unless-stopped

volumes:
  ollama:
  chat-data:
  voice-models:
  certs:
